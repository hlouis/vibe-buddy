[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    m5stack/M5Unified
    m5stack/M5GFX
    bblanchon/ArduinoJson @ ^7.0.0
    ; Opus encoder. Exposes the stock libopus C API (opus_encoder_create
    ; etc.), which is why it's preferred over PCMFlowOpus — the latter is
    ; MIT but only reachable through PCMFlow's sink/source abstraction,
    ; and we already own our ring buffer.
    ;
    ; NOTE: this package is declared GPL-3.0 (libopus underneath is BSD).
    ; Harmless while this repo is private and unlicensed; it would need
    ; revisiting before any public release.
    sh123/esp32_opus @ ^1.0.3

[env:m5stack-sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    ${env.lib_deps}
