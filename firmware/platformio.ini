[env]
; Arduino as an ESP-IDF component, not the precompiled core. The only
; reason is sdkconfig.defaults: the prebuilt core has CONFIG_PM_ENABLE and
; CONFIG_BT_CTRL_MODEM_SLEEP compiled out, so light sleep and BT modem
; sleep are unreachable no matter what the code does. See that file.
;
; Cost: the first build compiles ESP-IDF from source (minutes, not
; seconds). The Arduino API, M5Unified, and setup()/loop() all still work.
framework = arduino, espidf
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; ESP-IDF compiles with -Werror, the prebuilt Arduino core did not.
    ; libopus trips -Wmaybe-uninitialized in quant_LTP_gains.c: a known
    ; GCC false positive (the variable is assigned on every path the
    ; compiler can't prove). Demote to a warning rather than patch a
    ; third-party dep — and only this one, so real uninitialized reads in
    ; our own code still fail the build.
    -Wno-error=maybe-uninitialized
lib_deps =
    m5stack/M5Unified
    m5stack/M5GFX
    bblanchon/ArduinoJson @ ^7.0.0
    ; Opus encoder. Exposes the stock libopus C API (opus_encoder_create
    ; etc.), which is why it's preferred over PCMFlowOpus — the latter is
    ; MIT but only reachable through PCMFlow's sink/source abstraction,
    ; and we already own our ring buffer.
    ;
    ; NOTE: this package is declared GPL-3.0 (libopus underneath is BSD).
    ; Harmless while this repo is private and unlicensed; it would need
    ; revisiting before any public release.
    sh123/esp32_opus @ ^1.0.3

[env:m5stack-sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_qspi
build_flags =
    ${env.build_flags}
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    ${env.lib_deps}
