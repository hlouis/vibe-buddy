name: VibeBuddy-macOS
options:
  bundleIdPrefix: com.hlouis
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    # CODE_SIGN_STYLE / DEVELOPMENT_TEAM live in Local.xcconfig (per-dev,
    # gitignored) — see configFiles below and Local.xcconfig.example.
    # Pinning identity per-dev keeps the macOS Accessibility grant from
    # being invalidated on every regenerate.
    # Required by GENERATE_INFOPLIST_FILE: YES — without these the
    # auto-generated Info.plist has no CFBundleVersion /
    # CFBundleShortVersionString and the installer rejects the .app.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
packages:
  VibeBuddyCore:
    path: ../shared
targets:
  # Target name disambiguates from the iOS target inside the umbrella
  # workspace; PRODUCT_NAME below keeps the built .app called "VibeBuddy".
  VibeBuddy-macOS:
    type: application
    platform: macOS
    sources:
      - path: VibeBuddy
    dependencies:
      - package: VibeBuddyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hlouis.vibebuddy
        PRODUCT_NAME: VibeBuddy
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Vibe Buddy needs Bluetooth to connect to your M5Stack hardware."
        # Mic mode (no hardware device): falls back to the system
        # microphone, gated by a global Right Option PTT hotkey.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Vibe Buddy uses the system microphone when no VibeBuddy hardware is connected, so push-to-talk transcription works on any Mac."
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
        # Disable sandbox during dev so Bluetooth works without extra entitlements.
        # When we ship we'll opt back in with com.apple.security.device.bluetooth.
        ENABLE_APP_SANDBOX: NO
        # Hardened Runtime is on (default for Apple Development signing).
        # Microphone access under Hardened Runtime requires the
        # com.apple.security.device.audio-input entitlement — without it
        # AVCaptureDevice.requestAccess(.audio) is silently denied and
        # the app never shows up in System Settings → Microphone.
        CODE_SIGN_ENTITLEMENTS: VibeBuddy/VibeBuddy.entitlements
